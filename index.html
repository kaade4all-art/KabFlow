<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KabFlow</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#17212b}.hidden{display:none!important}.side{position:fixed;inset:0 auto 0 0;width:240px;background:#0d2340;color:#fff;padding:22px 14px}.brand{font-size:28px;font-weight:800;padding:5px 12px 30px}.brand span{color:#d4a72c}.nav button{width:100%;padding:12px;border:0;border-radius:9px;background:none;color:#dce6f0;text-align:left;margin:3px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#183a61;color:#fff}.main{margin-left:240px;width:calc(100% - 240px);padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{margin:0}.screen{display:none}.screen.active{display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card,.row,.tablewrap{background:#fff;border-radius:13px;box-shadow:0 2px 10px #0d234010}.card{padding:18px}.stat{font-size:25px;font-weight:800;margin:8px 0}.muted{color:#71808e;font-size:13px}.section{margin-top:22px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sectionhead h2{font-size:17px}.row{padding:15px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin:9px 0}.badge{font-size:11px;padding:5px 8px;border-radius:20px;background:#e6f7f0;color:#08745f}.warn{background:#fff2d8;color:#976000}.danger{background:#fde8e8;color:#a32929}.btn{border:0;border-radius:8px;padding:10px 14px;background:#0d2340;color:#fff;cursor:pointer}.gold{background:#d4a72c;color:#0d2340;font-weight:700}.light{background:#eaf0f6;color:#0d2340}.search,.input,.select{width:100%;padding:11px;border:1px solid #d5dce3;border-radius:8px;margin:6px 0 12px;background:#fff}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px;text-align:left;border-bottom:1px solid #edf0f2;font-size:13px}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{background:#fff;width:min(470px,100%);padding:24px;border-radius:15px}.close{float:right;border:0;background:none;font-size:24px;cursor:pointer}.actions{display:flex;gap:7px;flex-wrap:wrap}.toast{position:fixed;right:20px;bottom:20px;background:#0d2340;color:#fff;padding:12px 16px;border-radius:9px;display:none;z-index:20}.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#f5f7fa}.authbox{background:#fff;width:min(430px,100%);padding:30px;border-radius:16px;box-shadow:0 4px 25px #0d234020}.authbox h1{margin-top:0}.error{background:#fde8e8;color:#a32929;padding:10px;border-radius:8px;font-size:13px;margin-bottom:12px}.voicebox{border:1px solid #dfe6ed;border-radius:12px;padding:14px;background:#fbfcfe}.recording{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.timer{font-weight:700;color:#a32929}.audio{width:100%;margin-top:10px}.small{font-size:12px;color:#71808e}.note{background:#fff9e8;border:1px solid #f1dfaa;border-radius:9px;padding:12px;font-size:13px}
@media(max-width:800px){.side{width:70px}.brand{font-size:0}.brand:after{content:'K';font-size:26px}.nav button{font-size:0;text-align:center}.main{margin-left:70px;width:calc(100% - 70px);padding:18px}.grid{grid-template-columns:repeat(2,1fr)}.row{align-items:flex-start;flex-direction:column}}
</style></head><body>
<div id="auth" class="auth"><div class="authbox"><div class="brand" style="color:#0d2340;padding:0 0 18px">Kab<span>Flow</span></div><h1>Sign in</h1><p class="muted">Use the email and password for your KabFlow account.</p><div id="authError" class="error hidden"></div><label>Email</label><input id="email" class="input" type="email" autocomplete="email"><label>Password</label><input id="password" class="input" type="password" autocomplete="current-password"><label style="display:flex;align-items:center;gap:8px;font-size:13px;margin:0 0 8px;cursor:pointer"><input id="showPassword" type="checkbox" onchange="togglePassword()" style="width:auto;margin:0"> Show password</label><button class="btn" style="width:100%;margin-top:6px" onclick="signIn()">Sign in</button><button class="btn light" style="width:100%;margin-top:8px" onclick="showForgot()">Forgot password?</button><div id="forgotBox" class="hidden" style="margin-top:16px"><label>Account email</label><input id="resetEmail" class="input" type="email" autocomplete="email"><button class="btn gold" style="width:100%" onclick="sendReset()">Send reset email</button></div></div></div>
<div id="recovery" class="auth hidden"><div class="authbox"><div class="brand" style="color:#0d2340;padding:0 0 18px">Kab<span>Flow</span></div><h1>Set new password</h1><p class="muted">Choose a new password for your KabFlow account.</p><label>New password</label><input id="newPassword" class="input" type="password"><button class="btn" style="width:100%" onclick="setNewPassword()">Update password</button></div></div><div id="appShell" class="hidden"><aside class="side"><div class="brand">Kab<span>Flow</span></div><div class="nav"><button class="active" onclick="show('dashboard',this)">Dashboard</button><button onclick="show('customers',this)">Customers</button><button onclick="show('orders',this)">Orders</button><button onclick="show('followups',this)">Follow Ups</button><button onclick="show('tasks',this)">Tasks</button><button onclick="show('sales',this)">Sales</button><button onclick="show('team',this)">Team</button><button onclick="show('invoices',this)">Invoices</button><button onclick="show('voiceNotes',this)">Voice Notes</button></div><button class="btn light" style="width:100%;margin-top:18px" onclick="signOut()">Sign out</button></aside><main class="main"><div class="top"><h1 id="title">Dashboard</h1><span id="businessName" class="muted"></span></div><section id="dashboard" class="screen active"></section><section id="customers" class="screen"></section><section id="orders" class="screen"></section><section id="followups" class="screen"></section><section id="tasks" class="screen"></section><section id="sales" class="screen"></section><section id="team" class="screen"></section><section id="invoices" class="screen"></section><section id="voiceNotes" class="screen"></section></main></div>
<div id="modal" class="modal"><div class="box"><button class="close" onclick="closeModal()">×</button><h2 id="mtitle"></h2><div id="mbody"></div></div></div><div id="toast" class="toast"></div>
<script>
const SUPABASE_URL='https://jlzcvtpvgvhmzgfnrovr.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_tZK_j7orO13jGpYzCt7BIQ_hRhQUEz8';
const client=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let user=null,business=null,data={customers:[],orders:[],payments:[],followups:[],tasks:[],team:[],invoices:[],voiceNotes:[]};let recorder=null,recordChunks=[],recordingTimer=null,recordingSeconds=0,voiceObjectUrl=null;
const money=n=>'₦'+Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:0});
function toast(x){let t=document.getElementById('toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}
function showAuthError(x){let e=document.getElementById('authError');e.textContent=x;e.classList.remove('hidden')}
function togglePassword(){let p=document.getElementById('password');p.type=document.getElementById('showPassword').checked?'text':'password'}
async function signIn(){document.getElementById('authError').classList.add('hidden');let email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)return showAuthError('Enter your email and password.');let {data:d,error}=await client.auth.signInWithPassword({email,password});if(error)return showAuthError(error.message);user=d.user;await startApp()}
async function signOut(){await client.auth.signOut();location.reload()}
async function startApp(){let {data:m,error:me}=await client.from('business_members').select('business_id,role').eq('user_id',user.id).limit(1).maybeSingle();if(me)return showAuthError('Could not load your business membership: '+me.message);if(!m){return showAuthError('Your account is not connected to a KabFlow business yet.')}let {data:b,error:be}=await client.from('businesses').select('id,name').eq('id',m.business_id).single();if(be)return showAuthError('Could not load your business: '+be.message);business=b;document.getElementById('businessName').textContent=business.name;document.getElementById('auth').classList.add('hidden');document.getElementById('appShell').classList.remove('hidden');await loadAll();render()}
async function loadAll(){let q=async(table,order='created_at')=>{let r=await client.from(table).select('*').eq('business_id',business.id).order(order,{ascending:false});if(r.error)throw r.error;return r.data||[]};let safe=async(table,order='created_at')=>{try{return await q(table,order)}catch(e){console.warn(table,e.message);return []}};try{[data.customers,data.orders,data.payments,data.followups,data.tasks,data.team,data.invoices,data.voiceNotes]=await Promise.all([q('customers'),q('orders'),q('payments','payment_date'),q('followups','followup_date'),q('tasks'),q('team_members'),safe('invoices','due_date'),safe('voice_notes')])}catch(e){toast('Database error: '+e.message)}}
function customerName(id){return data.customers.find(c=>c.id===id)?.name||'Unknown customer'}
function wa(phone,name){window.open('https://wa.me/'+String(phone||'').replace(/\D/g,'')+'?text='+encodeURIComponent('Hello '+name+', '),'_blank')}
function show(id,b){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.getElementById('title').textContent=id[0].toUpperCase()+id.slice(1);document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b&&b.classList.add('active');render()}
function render(){let sales=data.payments.filter(x=>x.status==='paid'||x.status==='Paid').reduce((a,x)=>a+Number(x.amount||0),0);document.getElementById('dashboard').innerHTML=`<div class=grid><div class=card><span class=muted>Customers</span><div class=stat>${data.customers.length}</div></div><div class=card><span class=muted>Follow Ups</span><div class=stat>${data.followups.filter(x=>!x.done).length}</div></div><div class=card><span class=muted>Pending Orders</span><div class=stat>${data.orders.filter(x=>x.status!=='delivered'&&x.status!=='Delivered').length}</div></div><div class=card><span class=muted>Recorded Sales</span><div class=stat>${money(sales)}</div></div><div class=card><span class=muted>Overdue Invoices</span><div class=stat>${data.invoices.filter(i=>i.status==='overdue').length}</div></div></div><div class=section><div class=sectionhead><h2>Quick Actions</h2></div><div class=actions><button class=btn onclick="openForm('customer')">+ Customer</button><button class=btn onclick="openForm('order')">+ Order</button><button class="btn light" onclick="openForm('task')">+ Task</button><button class="btn gold" onclick="openForm('payment')">+ Payment</button></div><div class=note style="margin-top:14px"><b>KabFlow</b> is now connected to your Supabase database.</div></div>`;renderCustomers();renderOrders();renderFollowups();renderTasks();renderSales();renderTeam();renderInvoices();renderVoiceNotes()}
function renderCustomers(){document.getElementById('customers').innerHTML=`<div class=sectionhead><h2>Customers</h2><button class=btn onclick="openForm('customer')">+ Add Customer</button></div><input class=search placeholder="Search customers..." oninput="filterRows(this.value)"><div class=tablewrap><table class=table id=ct><tr><th>Customer</th><th>Phone</th><th>Action</th></tr>${data.customers.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.phone||'')}</td><td><button class=btn onclick="wa('${esc(c.phone||'')}','${esc(c.name)}')">WhatsApp</button></td></tr>`).join('')}</table></div>`}
function filterRows(q){q=q.toLowerCase();document.querySelectorAll('#ct tr').forEach((r,i)=>{if(i)r.style.display=r.innerText.toLowerCase().includes(q)?'':'none'})}
function renderOrders(){document.getElementById('orders').innerHTML=`<div class=sectionhead><h2>Orders</h2><button class=btn onclick="openForm('order')">+ New Order</button></div>${data.orders.map(o=>`<div class=row><div><b>#${esc(o.order_number||o.id.slice(0,8))} · ${esc(customerName(o.customer_id))}</b><br><span class=muted>${esc(o.notes||'')} · ${money(o.total_amount)}</span></div><div class=actions><span class="badge ${o.status==='pending'?'warn':''}">${esc(o.status)}</span><button class="btn light" onclick="nextOrder('${o.id}')">Update</button></div></div>`).join('')}`}
function renderFollowups(){document.getElementById('followups').innerHTML=`<div class=sectionhead><h2>Follow Ups</h2><button class=btn onclick="openForm('followup')">+ Schedule</button></div>${data.followups.map(f=>`<div class=row style="${f.done?'opacity:.5':''}"><div><b>${esc(customerName(f.customer_id))}</b><br><span class=muted>${esc(f.note||'')} · ${esc(f.followup_date)}</span></div><div class=actions><button class=btn onclick="let c=data.customers.find(x=>x.id==='${f.customer_id}');wa(c?.phone,c?.name)">WhatsApp</button>${f.done?'<span class=badge>Done</span>':`<button class="btn light" onclick="doneFollow('${f.id}')">Done</button>`}</div></div>`).join('')}`}
function renderTasks(){document.getElementById('tasks').innerHTML=`<div class=sectionhead><h2>Tasks</h2><button class=btn onclick="openForm('task')">+ New Task</button></div>${data.tasks.map(t=>`<div class=row><div><b>${esc(t.title)}</b><br><span class=muted>${esc(t.due_date||'')} · ${esc(t.priority)}</span></div><div class=actions><span class="badge ${t.status==='pending'?'warn':''}">${esc(t.status)}</span><button class="btn light" onclick="nextTask('${t.id}')">Update</button></div></div>`).join('')}`}
function renderSales(){let paid=data.payments.filter(x=>x.status==='paid'||x.status==='Paid').reduce((a,x)=>a+Number(x.amount||0),0);document.getElementById('sales').innerHTML=`<div class=grid><div class=card><span class=muted>Paid Sales</span><div class=stat>${money(paid)}</div></div><div class=card><span class=muted>Total Orders</span><div class=stat>${data.orders.length}</div></div><div class=card><span class=muted>Customers</span><div class=stat>${data.customers.length}</div></div><div class=card><span class=muted>Team</span><div class=stat>${data.team.length}</div></div></div><div class=section><div class=sectionhead><h2>Payments</h2><button class="btn gold" onclick="openForm('payment')">+ Record Payment</button></div><div class=tablewrap><table class=table><tr><th>Customer</th><th>Amount</th><th>Method</th><th>Status</th></tr>${data.payments.map(p=>`<tr><td>${esc(customerName(p.customer_id))}</td><td>${money(p.amount)}</td><td>${esc(p.method||'')}</td><td><span class="badge ${p.status==='unpaid'?'danger':''}">${esc(p.status)}</span></td></tr>`).join('')}</table></div></div>`}
function renderTeam(){document.getElementById('team').innerHTML=`<div class=sectionhead><h2>Team</h2><button class=btn onclick="openForm('team')">+ Add Member</button></div>${data.team.map(m=>`<div class=row><div><b>${esc(m.name)}</b><br><span class=muted>${esc(m.role)}</span></div><span class=badge>Active</span></div>`).join('')}`}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderInvoices(){let total=data.invoices.reduce((a,i)=>a+Number(i.amount||0),0);let overdue=data.invoices.filter(i=>i.status==='overdue');document.getElementById('invoices').innerHTML=`<div class=sectionhead><h2>Invoices</h2><button class="btn gold" onclick="openForm('invoice')">+ New Invoice</button></div><div class=grid><div class=card><span class=muted>Total Invoices</span><div class=stat>${data.invoices.length}</div></div><div class=card><span class=muted>Invoice Value</span><div class=stat>${money(total)}</div></div><div class=card><span class=muted>Overdue</span><div class=stat>${overdue.length}</div></div><div class=card><span class=muted>Outstanding</span><div class=stat>${money(data.invoices.filter(i=>i.status!=='paid'&&i.status!=='cancelled').reduce((a,i)=>a+Math.max(0,Number(i.amount||0)-Number(i.amount_paid||0)),0))}</div></div></div><div class=section>${data.invoices.map(i=>`<div class=row><div><b>${esc(i.invoice_number)}</b> · ${esc(customerName(i.customer_id))}<br><span class=muted>${money(i.amount)} · Due ${esc(i.due_date||'')}</span></div><span class="badge ${i.status==='overdue'?'danger':i.status==='paid'?'':'warn'}">${esc(i.status)}</span></div>`).join('')}</div>`}
function renderVoiceNotes(){document.getElementById('voiceNotes').innerHTML=`<div class=sectionhead><h2>Voice Notes</h2><button class=btn onclick="openForm('voice')">+ Record Voice Note</button></div>${data.voiceNotes.length?data.voiceNotes.map(v=>`<div class=row><div><b>${esc(customerName(v.customer_id))}</b><br><span class=muted>${esc(v.transcript||'Voice note')} · ${new Date(v.created_at).toLocaleString()}</span></div><div class=actions>${v.storage_path?`<button class="btn light" onclick="playStoredVoice('${esc(v.storage_path)}')">Play</button>`:''}</div></div>`).join(''):`<div class=note>No voice notes yet. Record one from a customer, order, or follow up.`}</div>`}
async function playStoredVoice(path){let r=await client.storage.from('kabflow-voice-notes').createSignedUrl(path,3600);if(r.error)return toast(r.error.message);let a=new Audio(r.data.signedUrl);a.play().catch(()=>toast('Could not play the voice note.'));}
function startTimer(){recordingSeconds=0;document.getElementById('voiceTimer').textContent='00:00';recordingTimer=setInterval(()=>{recordingSeconds++;let m=String(Math.floor(recordingSeconds/60)).padStart(2,'0'),s=String(recordingSeconds%60).padStart(2,'0');document.getElementById('voiceTimer').textContent=`${m}:${s}`},1000)}
function stopTimer(){clearInterval(recordingTimer);recordingTimer=null}
async function startRecording(){try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});recordChunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data)};recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());let blob=new Blob(recordChunks,{type:recorder.mimeType||'audio/webm'});voiceObjectUrl=URL.createObjectURL(blob);let a=document.getElementById('voicePreview');a.src=voiceObjectUrl;a.classList.remove('hidden');document.getElementById('saveVoiceBtn').disabled=false};recorder.start();startTimer();document.getElementById('recordBtn').disabled=true;document.getElementById('stopBtn').disabled=false;toast('Recording started')}catch(e){toast('Microphone access was not allowed.')}}
function stopRecording(){if(recorder&&recorder.state!=='inactive'){recorder.stop();stopTimer();document.getElementById('recordBtn').disabled=false;document.getElementById('stopBtn').disabled=true;toast('Recording ready')}}
async function saveVoice(){if(!recordChunks.length)return toast('Record a voice note first');let customerId=document.getElementById('voiceCustomer').value;let blob=new Blob(recordChunks,{type:recorder?.mimeType||'audio/webm'});let ext=(blob.type.includes('ogg')?'ogg':'webm');let path=`${business.id}/${crypto.randomUUID()}.${ext}`;let up=await client.storage.from('kabflow-voice-notes').upload(path,blob,{contentType:blob.type,upsert:false});if(up.error)return toast(up.error.message);let transcript=document.getElementById('voiceTranscript').value.trim();let ins=await client.from('voice_notes').insert({business_id:business.id,customer_id:customerId,storage_path:path,duration_seconds:recordingSeconds,transcript}).select().single();if(ins.error){await client.storage.from('kabflow-voice-notes').remove([path]);return toast(ins.error.message)}closeModal();recordChunks=[];if(voiceObjectUrl)URL.revokeObjectURL(voiceObjectUrl);voiceObjectUrl=null;await loadAll();render();toast('Voice note saved')}
function showForgot(){document.getElementById('forgotBox').classList.toggle('hidden');document.getElementById('resetEmail').value=document.getElementById('email').value}
async function sendReset(){let email=document.getElementById('resetEmail').value.trim();if(!email)return toast('Enter your email');let r=await client.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+'/'});if(r.error)return toast(r.error.message);toast('Reset email sent')}
async function setNewPassword(){let p=document.getElementById('newPassword').value;if(p.length<8)return toast('Password must be at least 8 characters');let r=await client.auth.updateUser({password:p});if(r.error)return toast(r.error.message);document.getElementById('recovery').classList.add('hidden');toast('Password updated. You can now sign in.')}
function openForm(type){let c=data.customers.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');if(!c&&['order','payment','followup'].includes(type))return toast('Add a customer first.');let forms={customer:`<label>Name</label><input id=f1 class=input><label>WhatsApp</label><input id=f2 class=input><label>Notes</label><input id=f3 class=input><button class=btn onclick="addCustomer()">Save Customer</button>`,order:`<label>Customer</label><select id=f1 class=select>${c}</select><label>Amount</label><input id=f2 class=input type=number><label>Notes</label><input id=f3 class=input><button class=btn onclick="addOrder()">Create Order</button>`,task:`<label>Task</label><input id=f1 class=input><label>Priority</label><select id=f2 class=select><option value="medium">Medium</option><option value="high">High</option><option value="low">Low</option></select><button class=btn onclick="addTask()">Save Task</button>`,payment:`<label>Customer</label><select id=f1 class=select>${c}</select><label>Amount</label><input id=f2 class=input type=number><label>Method</label><select id=f3 class=select><option>Transfer</option><option>Cash</option><option>POS</option></select><button class="btn gold" onclick="addPayment()">Record Payment</button>`,followup:`<label>Customer</label><select id=f1 class=select>${c}</select><label>Note</label><input id=f2 class=input><label>Date</label><input id=f3 class=input type=date><button class=btn onclick="addFollow()">Schedule</button>`,team:`<label>Name</label><input id=f1 class=input><label>Role</label><select id=f2 class=select><option>Staff</option><option>Manager</option></select><button class=btn onclick="addMember()">Add Member</button>`,invoice:`<label>Customer</label><select id=f1 class=select>${c}</select><label>Invoice Number</label><input id=f2 class=input><label>Amount</label><input id=f3 class=input type=number><label>Due Date</label><input id=f4 class=input type=date><button class=btn onclick="addInvoice()">Create Invoice</button>`,voice:`<label>Customer</label><select id=voiceCustomer class=select>${c}</select><div class=voicebox><div class=recording><button id=recordBtn class=btn onclick="startRecording()">Start Recording</button><button id=stopBtn class=btn light onclick="stopRecording()" disabled>Stop</button><span id=voiceTimer class=timer>00:00</span></div><audio id=voicePreview class=audio hidden controls></audio><label style="display:block;margin-top:10px">Optional transcription</label><textarea id=voiceTranscript class=input rows=3 placeholder="Type or paste a short description of the voice note"></textarea><button id=saveVoiceBtn class=btn gold onclick="saveVoice()" disabled>Save Voice Note</button></div>`};document.getElementById('mtitle').textContent=type==='customer'?'Add Customer':type==='order'?'New Order':type==='task'?'New Task':type==='payment'?'Record Payment':type==='followup'?'Schedule Follow Up':type==='invoice'?'New Invoice':type==='voice'?'Record Voice Note':'Add Team Member';document.getElementById('mbody').innerHTML=forms[type];document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
async function addCustomer(){let name=f1.value.trim(),phone=f2.value.trim(),notes=f3.value.trim();if(!name||!phone)return toast('Name and WhatsApp are required');let r=await client.from('customers').insert({business_id:business.id,name,phone,notes}).select().single();if(r.error)return toast(r.error.message);closeModal();await loadAll();render();toast('Customer added')}
async function addOrder(){let amount=Number(f2.value),notes=f3.value.trim();if(!amount)return toast('Enter amount');let r=await client.from('orders').insert({business_id:business.id,customer_id:f1.value,total_amount:amount,notes,status:'pending'}).select().single();if(r.error)return toast(r.error.message);closeModal();await loadAll();render();toast('Order created')}
async function addTask(){let title=f1.value.trim();if(!title)return toast('Enter a task');let r=await client.from('tasks').insert({business_id:business.id,title,priority:f2.value,status:'pending',assigned_to:user.id}).select().single();if(r.error)return toast(r.error.message);closeModal();await loadAll();render();toast('Task added')}
async function addPayment(){let amount=Number(f2.value);if(!amount)return toast('Enter amount');let r=await client.from('payments').insert({business_id:business.id,customer_id:f1.value,amount,method:f3.value,status:'paid'}).select().single();if(r.error)return toast(r.error.message);closeModal();await loadAll();render();toast('Payment recorded')}
async function addFollow(){if(!f2.value.trim())return toast('Enter follow up note');if(!f3.value)return toast('Choose a date');let r=await client.from('followups').insert({business_id:business.id,customer_id:f1.value,note:f2.value.trim(),followup_date:f3.value,done:false}).select().single();if(r.error)return toast(r.error.message);closeModal();await loadAll();render();toast('Follow up scheduled')}
async function addMember(){let name=f1.value.trim();if(!name)return toast('Enter name');let r=await client.from('team_members').insert({business_id:business.id,name,role:f2.value}).select().single();if(r.error)return toast(r.error.message);closeModal();await loadAll();render();toast('Member added')}
async function addInvoice(){let amount=Number(f3.value),invoice_number=f2.value.trim(),due_date=f4.value;if(!invoice_number||!amount||!due_date)return toast('Complete invoice details');let r=await client.from('invoices').insert({business_id:business.id,customer_id:f1.value,invoice_number,amount,due_date,status:'sent'}).select().single();if(r.error)return toast(r.error.message);closeModal();await loadAll();render();toast('Invoice created')}
async function doneFollow(id){let r=await client.from('followups').update({done:true}).eq('id',id).eq('business_id',business.id);if(r.error)return toast(r.error.message);await loadAll();render()}
async function nextOrder(id){let o=data.orders.find(x=>x.id===id);let next=o.status==='pending'?'processing':o.status==='processing'?'ready':'delivered';let r=await client.from('orders').update({status:next}).eq('id',id).eq('business_id',business.id);if(r.error)return toast(r.error.message);await loadAll();render()}
async function nextTask(id){let t=data.tasks.find(x=>x.id===id);let next=t.status==='pending'?'in_progress':t.status==='in_progress'?'done':'done';let r=await client.from('tasks').update({status:next}).eq('id',id).eq('business_id',business.id);if(r.error)return toast(r.error.message);await loadAll();render()}
client.auth.onAuthStateChange(async(event,session)=>{if(event==='PASSWORD_RECOVERY'){document.getElementById('auth').classList.add('hidden');document.getElementById('appShell').classList.add('hidden');document.getElementById('recovery').classList.remove('hidden')}else if(event==='SIGNED_IN'&&session&&!business){user=session.user;await startApp()}});client.auth.getSession().then(async({data:s})=>{if(s.session){user=s.session.user;await startApp()}})
</script></body></html>
