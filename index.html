<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KabFlow Phase 2</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef5ff;color:#17212b}.hidden{display:none!important}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#0d2340 0%,#1267d6 55%,#2f80ed 100%)}.authbox{background:#fff;width:min(430px,100%);padding:30px;border-radius:18px;box-shadow:0 15px 45px #061a332b}.brand{font-size:30px;font-weight:800;color:#0d2340}.brand span{color:#d4a72c}.muted{color:#71808e;font-size:13px}.input{width:100%;padding:12px;margin:7px 0 13px;border:1px solid #d5dce3;border-radius:9px}.passwrap{position:relative}.passwrap .input{padding-right:72px}.showpass{position:absolute;right:10px;top:8px;border:0;background:none;color:#0d2340;cursor:pointer;padding:8px}.btn{border:0;border-radius:9px;padding:11px 15px;background:#0d2340;color:#fff;cursor:pointer}.gold{background:#d4a72c;color:#0d2340;font-weight:700}.link{border:0;background:none;color:#0d2340;cursor:pointer;padding:8px 0}.msg{margin:12px 0;padding:10px;border-radius:8px;background:#fff3cd;font-size:13px}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button{flex:1}.app{min-height:100vh}.side{position:fixed;left:0;top:0;bottom:0;width:235px;background:#0d2340;color:#fff;padding:22px 14px}.side .brand{color:#fff;margin-bottom:25px;padding-left:10px}.nav button{width:100%;border:0;background:none;color:#dce6f0;text-align:left;padding:12px;border-radius:8px;margin:3px 0;cursor:pointer}.nav button:hover,.nav button.active{background:#183a61;color:#fff}.main{margin-left:235px;padding:28px;background:#eef5ff;min-height:100vh}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card,.panel{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 10px #0d234010}.stat{font-size:27px;font-weight:800;margin:8px 0}.section{margin-top:22px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.screen{display:none}.screen.active{display:block}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}.table th,.table td{padding:13px;text-align:left;border-bottom:1px solid #edf0f2;font-size:13px}.badge{font-size:11px;padding:5px 8px;border-radius:20px;background:#e6f7f0;color:#08745f}.danger{background:#fde8e8;color:#a32929}.warn{background:#fff2d8;color:#976000}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{background:#fff;width:min(520px,100%);padding:25px;border-radius:15px;max-height:90vh;overflow:auto}.close{float:right;border:0;background:none;font-size:25px;cursor:pointer}.actions{display:flex;gap:8px;flex-wrap:wrap}.textarea{min-height:90px;resize:vertical}.voice{display:flex;gap:8px;align-items:center;margin:10px 0}.recording{color:#a32929;font-weight:700}
.setup{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:25px;background:linear-gradient(135deg,#0d2340 0%,#1267d6 60%,#2f80ed 100%)}.setupbox{width:min(620px,100%);background:#fff;border-radius:20px;padding:32px;box-shadow:0 18px 50px #061a3333}.setupbox h1{margin-top:0;color:#0d2340}.setupgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}.setupbox .input,.setupbox select{width:100%;padding:12px;margin:7px 0 13px;border:1px solid #d5dce3;border-radius:9px;background:#fff}.setupbox .full{grid-column:1/-1}@media(max-width:800px){.side{width:70px}.side .brand{font-size:0}.side .brand:after{content:'K';font-size:28px}.nav button{font-size:0;text-align:center}.main{margin-left:70px;padding:18px}.grid{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;gap:10px}}
</style>
</head>
<body>

<div id="auth" class="auth">
  <div class="authbox">
    <div class="brand">Kab<span>Flow</span></div>
    <p class="muted">Organize your WhatsApp business in one place.</p>
    <div class="tabs">
      <button id="loginTab" class="btn" onclick="setAuthMode('login')">Sign in</button>
      <button id="signupTab" class="btn gold" onclick="setAuthMode('signup')">Create account</button>
    </div>
    <label>Email</label><input id="email" class="input" type="email" autocomplete="email">
    <label>Password</label>
    <div class="passwrap"><input id="password" class="input" type="password" autocomplete="current-password"><button class="showpass" onclick="togglePassword()">Show</button></div>
    <div id="confirmWrap" class="hidden"><label>Confirm password</label><input id="confirmPassword" class="input" type="password"></div>
    <button id="authBtn" class="btn" style="width:100%" onclick="submitAuth()">Sign in</button>
    <button id="forgotBtn" class="link" onclick="forgotPassword()">Forgot password?</button>
    <div id="authMsg"></div>
  </div>
</div>

<div id="setup" class="setup hidden">
  <div class="setupbox">
    <div class="brand">Kab<span>Flow</span></div>
    <h1>Welcome to KabFlow</h1>
    <p class="muted">Tell us about yourself and your business.</p>
    <div class="setupgrid">
      <div><label>Full Name</label><input id="sFullName" class="input" type="text" autocomplete="name"></div>
      <div><label>Email Address</label><input id="sEmail" class="input" type="email" readonly></div>
      <div><label>Business Name</label><input id="sBusinessName" class="input" type="text"></div>
      <div><label>Phone Number</label><input id="sPhone" class="input" type="tel" autocomplete="tel"></div>
      <div class="full"><label>Business Address</label><input id="sAddress" class="input" type="text" autocomplete="street-address"></div>
      <div class="full"><label>Business Type</label><select id="sBusinessType" class="input"><option value="">Select business type</option><option>Fashion</option><option>Food and catering</option><option>Beauty and cosmetics</option><option>Electronics</option><option>Retail</option><option>Wholesale</option><option>Services</option><option>Real estate</option><option>Education</option><option>Other</option></select></div>
    </div>
    <div id="setupMsg"></div>
    <button class="btn" style="width:100%;margin-top:8px" onclick="saveBusinessSetup()">Save and Continue</button>
  </div>
</div>

<div id="app" class="app hidden">
<aside class="side">
  <div class="brand">Kab<span>Flow</span></div>
  <div class="nav">
    <button class="active" onclick="show('dashboard',this)">Dashboard</button>
    <button onclick="show('customers',this)">Customers</button>
    <button onclick="show('orders',this)">Orders</button>
    <button onclick="show('followups',this)">Follow Ups</button>
    <button onclick="show('tasks',this)">Tasks</button>
    <button onclick="show('sales',this)">Payments</button>
    <button onclick="show('invoices',this)">Invoices</button>
    <button onclick="show('team',this)">Team</button>
    <button onclick="signOut()">Sign out</button>
  </div>
</aside>
<main class="main">
<div class="top"><h1 id="title">Dashboard</h1><span id="businessName" class="muted">KabFlow</span></div>
<section id="dashboard" class="screen active"></section>
<section id="customers" class="screen"></section>
<section id="orders" class="screen"></section>
<section id="followups" class="screen"></section>
<section id="tasks" class="screen"></section>
<section id="sales" class="screen"></section>
<section id="invoices" class="screen"></section>
<section id="team" class="screen"></section>
</main></div>

<div id="modal" class="modal"><div class="box"><button class="close" onclick="closeModal()">×</button><h2 id="mtitle"></h2><div id="mbody"></div></div></div>
<script>
const SUPABASE_URL="https://jlzcvtpvgvhmzgfnrovr.supabase.co";
const SUPABASE_KEY="sb_publishable_tZK_j7orO13jGpYzCt7BIQ_hRhQUEz8";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let mode="login", business=null, mediaRecorder=null, audioChunks=[];

function msg(t){document.getElementById("authMsg").innerHTML='<div class="msg">'+t+'</div>'}
function setAuthMode(m){mode=m;document.getElementById("loginTab").className=m==="login"?"btn":"btn gold";document.getElementById("signupTab").className=m==="signup"?"btn":"btn gold";document.getElementById("authBtn").textContent=m==="login"?"Sign in":"Create account";document.getElementById("forgotBtn").classList.toggle("hidden",m!=="login");document.getElementById("confirmWrap").classList.toggle("hidden",m!=="signup");document.getElementById("authMsg").innerHTML=""}
function togglePassword(){let x=document.getElementById("password");x.type=x.type==="password"?"text":"password";event.target.textContent=x.type==="password"?"Show":"Hide"}
async function submitAuth(){
 let email=document.getElementById("email").value.trim(), p=document.getElementById("password").value;
 if(!email||!p)return msg("Enter your email and password.");
 if(mode==="signup"){let c=document.getElementById("confirmPassword").value;if(p!==c)return msg("Passwords do not match.");let r=await sb.auth.signUp({email,password:p});if(r.error)return msg(r.error.message);msg("Account created. Check your email if confirmation is required, then sign in to complete your business setup.");}
 else {let r=await sb.auth.signInWithPassword({email,password:p});if(r.error)return msg(r.error.message);await boot();}
}
async function forgotPassword(){let e=document.getElementById("email").value.trim();if(!e)return msg("Enter your email first.");let r=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin});if(r.error)return msg(r.error.message);msg("Password recovery email sent.")}
async function signOut(){await sb.auth.signOut();location.reload()}
async function boot(){
 document.getElementById("auth").classList.add("hidden");
 await loadBusiness();
 if(!business){document.getElementById("auth").classList.remove("hidden");return}
 const complete=Boolean(business.setup_complete && business.name && business.business_type && business.owner_name && business.phone);
 if(!complete){showBusinessSetup();return}
 document.getElementById("setup").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");
 document.getElementById("businessName").textContent=business.name;
 await renderAll();
}
async function loadBusiness(){
 const {data:{user}}=await sb.auth.getUser(); if(!user)return;
 let r=await sb.from("businesses").select("*").eq("owner_id",user.id).limit(1).maybeSingle();
 if(r.error){msg(r.error.message);return}
 if(r.data)business=r.data;
 else {
   let ins=await sb.from("businesses").insert({owner_id:user.id,name:"My Business",currency:"₦",owner_email:user.email,setup_complete:false}).select().single();
   if(ins.error){msg(ins.error.message);return}
   business=ins.data;
 }
 document.getElementById("businessName").textContent=business?.name||"My Business";
}
async function showBusinessSetup(){
 const {data:{user}}=await sb.auth.getUser();
 document.getElementById("app").classList.add("hidden");
 document.getElementById("setup").classList.remove("hidden");
 document.getElementById("sEmail").value=business?.owner_email||user?.email||"";
 document.getElementById("sFullName").value=business?.owner_name||"";
 document.getElementById("sBusinessName").value=business?.name==="My Business"?"":(business?.name||"");
 document.getElementById("sAddress").value=business?.address||"";
 document.getElementById("sBusinessType").value=business?.business_type||"";
 document.getElementById("sPhone").value=business?.phone||"";
}
async function saveBusinessSetup(){
 const fullName=document.getElementById("sFullName").value.trim();
 const email=document.getElementById("sEmail").value.trim();
 const name=document.getElementById("sBusinessName").value.trim();
 const address=document.getElementById("sAddress").value.trim();
 const type=document.getElementById("sBusinessType").value;
 const phone=document.getElementById("sPhone").value.trim();
 const box=document.getElementById("setupMsg");
 if(!fullName||!email||!name||!address||!type||!phone){box.innerHTML='<div class="msg">Please complete all the fields before continuing.</div>';return}
 box.innerHTML='<div class="msg">Saving your business information...</div>';
 const r=await sb.from("businesses").update({owner_name:fullName,owner_email:email,name,address,business_type:type,phone,setup_complete:true}).eq("id",business.id).eq("owner_id",business.owner_id).select().single();
 if(r.error){box.innerHTML='<div class="msg">'+r.error.message+'</div>';return}
 business=r.data;
 document.getElementById("setup").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");
 document.getElementById("businessName").textContent=business.name;
 await renderAll();
}
async function rows(table){let q=sb.from(table).select("*").eq("business_id",business.id);let r=await q;return r.data||[]}
function show(id,b){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.getElementById("title").textContent=id==="sales"?"Payments":id[0].toUpperCase()+id.slice(1);document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));if(b)b.classList.add("active")}
async function renderAll(){await renderDashboard();await renderCustomers();await renderOrders();await renderFollowups();await renderTasks();await renderSales();await renderInvoices();await renderTeam()}
function money(n){return (business?.currency||"₦")+Number(n||0).toLocaleString("en-NG")}
async function renderDashboard(){let [c,o,p,f,t,i]=await Promise.all(["customers","orders","payments","followups","tasks","invoices"].map(rows));let sales=p.filter(x=>String(x.status).toLowerCase()==="paid").reduce((a,x)=>a+Number(x.amount),0);document.getElementById("dashboard").innerHTML=`<div class="grid"><div class="card"><span class="muted">Customers</span><div class="stat">${c.length}</div></div><div class="card"><span class="muted">Open Follow Ups</span><div class="stat">${f.filter(x=>!x.done).length}</div></div><div class="card"><span class="muted">Pending Orders</span><div class="stat">${o.filter(x=>x.status!=="Delivered").length}</div></div><div class="card"><span class="muted">Paid</span><div class="stat">${money(sales)}</div></div></div><div class="section panel"><div class="sectionhead"><h2>Quick Actions</h2></div><div class="actions"><button class="btn" onclick="openForm('customer')">+ Customer</button><button class="btn" onclick="openForm('order')">+ Order</button><button class="btn" onclick="openForm('payment')">+ Payment</button><button class="btn gold" onclick="openForm('invoice')">+ Invoice</button></div></div>`}
async function renderCustomers(){let d=await rows("customers");document.getElementById("customers").innerHTML=`<div class="sectionhead"><h2>Customers</h2><button class="btn" onclick="openForm('customer')">+ Add Customer</button></div><div class="tablewrap"><table class="table"><tr><th>Name</th><th>Phone</th><th>Status</th><th>Action</th></tr>${d.map(x=>`<tr><td>${x.name||""}</td><td>${x.phone||""}</td><td>${x.status||""}</td><td><button class="btn" onclick="wa('${x.phone||""}','${x.name||""}')">WhatsApp</button></td></tr>`).join("")}</table></div>`}
async function renderOrders(){let d=await rows("orders");document.getElementById("orders").innerHTML=`<div class="sectionhead"><h2>Orders</h2><button class="btn" onclick="openForm('order')">+ New Order</button></div>${d.map(x=>`<div class="panel section"><b>#${x.id?.slice?.(0,8)||""} ${x.item||x.notes||""}</b><br><span class="muted">${money(x.amount)} · ${x.status||""}</span></div>`).join("")}`}
async function renderFollowups(){let d=await rows("followups");document.getElementById("followups").innerHTML=`<div class="sectionhead"><h2>Follow Ups</h2><button class="btn" onclick="openForm('followup')">+ Schedule</button></div>${d.map(x=>`<div class="panel section"><b>${x.note||"Follow up"}</b><br><span class="muted">${x.scheduled_for||x.date||""}</span></div>`).join("")}`}
async function renderTasks(){let d=await rows("tasks");document.getElementById("tasks").innerHTML=`<div class="sectionhead"><h2>Tasks</h2><button class="btn" onclick="openForm('task')">+ Task</button></div>${d.map(x=>`<div class="panel section"><b>${x.title||x.name||"Task"}</b><br><span class="muted">${x.status||"To Do"}</span></div>`).join("")}`}
async function renderSales(){let d=await rows("payments");document.getElementById("sales").innerHTML=`<div class="sectionhead"><h2>Payments</h2><button class="btn" onclick="openForm('payment')">+ Record Payment</button></div><div class="tablewrap"><table class="table"><tr><th>Amount</th><th>Method</th><th>Status</th><th>Date</th></tr>${d.map(x=>`<tr><td>${money(x.amount)}</td><td>${x.method||""}</td><td>${x.status||""}</td><td>${x.created_at?new Date(x.created_at).toLocaleDateString():""}</td></tr>`).join("")}</table></div>`}
async function renderInvoices(){let d=await rows("invoices");document.getElementById("invoices").innerHTML=`<div class="sectionhead"><h2>Invoices</h2><button class="btn gold" onclick="openForm('invoice')">+ Create Invoice</button></div><div class="tablewrap"><table class="table"><tr><th>Invoice</th><th>Amount</th><th>Due</th><th>Status</th></tr>${d.map(x=>`<tr><td>${x.invoice_number||""}</td><td>${money(x.amount)}</td><td>${x.due_date||""}</td><td><span class="badge ${x.status==="overdue"?"danger":""}">${x.status||""}</span></td></tr>`).join("")}</table></div>`}
async function renderTeam(){let d=await rows("business_members");document.getElementById("team").innerHTML=`<div class="sectionhead"><h2>Team</h2><button class="btn" onclick="openForm('team')">+ Invite Member</button></div>${d.map(x=>`<div class="panel section">${x.user_id||""} · ${x.role||"Member"}</div>`).join("")}`}
function wa(p,n){let x=(p||"").replace(/\D/g,"");if(x)window.open("https://wa.me/"+x+"?text="+encodeURIComponent("Hello "+n+", ")," _blank")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function field(label,id,type="text",extra=""){return `<label>${label}</label><input id="${id}" class="input" type="${type}" ${extra}>`}
function openForm(type){
 let c=""; 
 let forms={
 customer:field("Name","f1")+field("WhatsApp","f2")+`<label>Notes</label><textarea id="f3" class="input textarea"></textarea><button class="btn" onclick="saveCustomer()">Save Customer</button>`,
 order:field("Item / Order","f1")+field("Amount","f2","number")+`<label>Notes</label><textarea id="f3" class="input textarea"></textarea><button class="btn" onclick="saveOrder()">Create Order</button>`,
 payment:field("Amount","f1","number")+field("Method","f2")+field("Status","f3")+`<button class="btn gold" onclick="savePayment()">Record Payment</button>`,
 invoice:field("Invoice Number","f1")+field("Amount","f2","number")+field("Due Date","f3","date")+`<label>Notes</label><textarea id="f4" class="input textarea"></textarea><button class="btn gold" onclick="saveInvoice()">Create Invoice</button>`,
 followup:field("Note","f1")+field("Date","f2","date")+`<button class="btn" onclick="saveFollowup()">Schedule</button>`,
 task:field("Task","f1")+field("Priority","f2")+`<button class="btn" onclick="saveTask()">Save Task</button>`,
 team:field("User ID / Email","f1")+field("Role","f2")+`<button class="btn" onclick="saveTeam()">Add Member</button>`
 };
 document.getElementById("mtitle").textContent=type==="customer"?"Add Customer":type==="order"?"New Order":type==="payment"?"Record Payment":type==="invoice"?"Create Invoice":type==="followup"?"Schedule Follow Up":type==="task"?"New Task":"Team Member";
 document.getElementById("mbody").innerHTML=forms[type];document.getElementById("modal").classList.add("show");
}
async function insert(table,obj){let r=await sb.from(table).insert({...obj,business_id:business.id});if(r.error)alert(r.error.message);else{closeModal();await renderAll()}}
async function saveCustomer(){await insert("customers",{name:f1.value,phone:f2.value,notes:f3.value,status:"Potential"})}
async function saveOrder(){await insert("orders",{item:f1.value,amount:Number(f2.value||0),notes:f3.value,status:"Processing"})}
async function savePayment(){await insert("payments",{amount:Number(f1.value||0),method:f2.value,status:f3.value||"Paid"})}
async function saveInvoice(){await insert("invoices",{invoice_number:f1.value,amount:Number(f2.value||0),due_date:f3.value,status:"draft",notes:f4.value})}
async function saveFollowup(){await insert("followups",{note:f1.value,scheduled_for:f2.value,done:false})}
async function saveTask(){await insert("tasks",{title:f1.value,priority:f2.value,status:"To Do"})}
async function saveTeam(){let r=await sb.from("business_members").insert({business_id:business.id,user_id:f1.value,role:f2.value||"Member"});if(r.error)alert(r.error.message);else{closeModal();await renderAll()}}
async function startVoice(){if(!navigator.mediaDevices)return alert("Voice recording is not supported in this browser.");if(mediaRecorder&&mediaRecorder.state==="recording"){mediaRecorder.stop();return}let stream=await navigator.mediaDevices.getUserMedia({audio:true});audioChunks=[];mediaRecorder=new MediaRecorder(stream);mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);mediaRecorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());let blob=new Blob(audioChunks,{type:"audio/webm"});let path=business.id+"/"+Date.now()+".webm";let r=await sb.storage.from("voice-notes").upload(path,blob,{contentType:"audio/webm"});if(r.error)alert(r.error.message);else alert("Voice note uploaded successfully.")};mediaRecorder.start();alert("Recording started. Click the voice button again to stop.")}
sb.auth.getSession().then(async({data})=>{if(data.session)await boot()});sb.auth.onAuthStateChange(async(e,s)=>{if(e==="PASSWORD_RECOVERY")msg("Set your new password in the recovery flow.")});
</script>
</body></html>
